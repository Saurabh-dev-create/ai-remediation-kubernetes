apiVersion: apps/v1
kind: Deployment

metadata:
  name: oom-app
  namespace: ai-remediation

spec:
  replicas: 1

  selector:
    matchLabels:
      app: oom-app

  template:
    metadata:
      labels:
        app: oom-app

    spec:
      containers:
      - name: oom-app
        image: dockerwithsaurabh/oom-demo:v1
        command:
        - python

        - -c

        - |
          x=[]
          while True:
               x.append("A"*1024*1024)

        resources:
          requests:
            memory: "32Mi"
          limits:
            memory: "64Mi"